<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Scottish castle with Saltire flags">
  <defs>
    <symbol id="saltire" viewBox="0 0 60 40">
      <clipPath id="sc"><rect width="60" height="40"/></clipPath>
      <g clip-path="url(#sc)">
        <rect width="60" height="40" fill="#0a4ea3"/>
        <path d="M-5,-4 L65,44 M65,-4 L-5,44" stroke="#f5f7fb" stroke-width="9"/>
      </g>
    </symbol>
    <g id="flag">
      <use href="#saltire" width="78" height="50"/>
    </g>
  </defs>

  <!-- distant hills -->
  <path d="M0,820 L0,700 C220,650 430,680 640,668 C840,657 1010,648 1200,690 L1200,820 Z" fill="#6f8154"/>
  <path d="M0,820 L0,742 C260,706 470,724 700,716 C920,709 1080,720 1200,742 L1200,820 Z" fill="#566b3d"/>

  <!-- curtain wall connecting the towers -->
  <rect x="330" y="560" width="540" height="110" fill="#bfb7a5"/>
  <rect x="330" y="560" width="540" height="110" fill="none" stroke="#9a917e" stroke-width="2"/>
  <!-- curtain-wall battlements -->
  <g fill="#bfb7a5" stroke="#9a917e" stroke-width="2">
    <rect x="332" y="540" width="34" height="24"/><rect x="386" y="540" width="34" height="24"/>
    <rect x="440" y="540" width="34" height="24"/><rect x="726" y="540" width="34" height="24"/>
    <rect x="780" y="540" width="34" height="24"/><rect x="834" y="540" width="34" height="24"/>
  </g>

  <!-- gate -->
  <path d="M556,670 L556,600 Q556,556 600,556 Q644,556 644,600 L644,670 Z" fill="#22273a"/>
  <path d="M556,670 L556,600 Q556,556 600,556 Q644,556 644,600 L644,670 Z" fill="none" stroke="#9a917e" stroke-width="3"/>

  <!-- left tower -->
  <rect x="300" y="430" width="112" height="240" fill="#c9c2b2"/>
  <rect x="380" y="430" width="32" height="240" fill="#aea693"/>
  <rect x="300" y="430" width="112" height="240" fill="none" stroke="#9a917e" stroke-width="2"/>
  <polygon points="292,432 420,432 356,326" fill="#39435f"/>
  <polygon points="292,432 420,432 356,326" fill="none" stroke="#2a3146" stroke-width="2"/>
  <rect x="347" y="486" width="18" height="46" rx="9" fill="#22273a"/>
  <line x1="356" y1="326" x2="356" y2="286" stroke="#5a5145" stroke-width="4"/>
  <g transform="translate(356,286) skewX(-7)"><use href="#flag"/></g>

  <!-- right tower -->
  <rect x="788" y="430" width="112" height="240" fill="#c9c2b2"/>
  <rect x="868" y="430" width="32" height="240" fill="#aea693"/>
  <rect x="788" y="430" width="112" height="240" fill="none" stroke="#9a917e" stroke-width="2"/>
  <polygon points="780,432 908,432 844,326" fill="#39435f"/>
  <polygon points="780,432 908,432 844,326" fill="none" stroke="#2a3146" stroke-width="2"/>
  <rect x="835" y="486" width="18" height="46" rx="9" fill="#22273a"/>
  <line x1="844" y1="326" x2="844" y2="286" stroke="#5a5145" stroke-width="4"/>
  <g transform="translate(844,286) skewX(-7)"><use href="#flag"/></g>

  <!-- central keep -->
  <rect x="452" y="356" width="296" height="314" fill="#cbc4b4"/>
  <rect x="690" y="356" width="58" height="314" fill="#aea693"/>
  <rect x="452" y="356" width="296" height="314" fill="none" stroke="#9a917e" stroke-width="2"/>
  <!-- keep battlements -->
  <g fill="#c2bba9" stroke="#9a917e" stroke-width="2">
    <rect x="454" y="330" width="32" height="28"/><rect x="506" y="330" width="32" height="28"/>
    <rect x="558" y="330" width="32" height="28"/><rect x="610" y="330" width="32" height="28"/>
    <rect x="662" y="330" width="32" height="28"/><rect x="714" y="330" width="32" height="28"/>
  </g>
  <!-- keep windows -->
  <path d="M500,470 L500,440 Q500,420 518,420 Q536,420 536,440 L536,470 Z" fill="#22273a"/>
  <path d="M664,470 L664,440 Q664,420 682,420 Q700,420 700,440 L700,470 Z" fill="#22273a"/>
  <!-- central flag pole + larger flag -->
  <line x1="600" y1="330" x2="600" y2="250" stroke="#5a5145" stroke-width="5"/>
  <g transform="translate(600,250) skewX(-7)"><use href="#saltire" width="94" height="60"/></g>
</svg>
